[workspace]
members = ["loong_reader", "loong_core", "loong_internal"]
default-members = ["loong_reader"]
resolver = "2"

[workspace.dependencies]
enumflags2 = "0.7.11"
log = "0.4.21"
microseh = "1.1.2"
schemars = "1.2.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.115"
serde_with = "3.14.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"
windows = "0.62.2"

[profile.release]
lto = true
codegen-units = 1
debug = "full"
split-debuginfo = "packed"
